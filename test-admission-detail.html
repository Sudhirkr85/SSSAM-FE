<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admission Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">Admission Detail API Test</h1>
        
        <div class="bg-white rounded-lg p-6 shadow">
            <h2 class="text-lg font-semibold mb-4">Test Results</h2>
            <div id="testResults" class="space-y-4">
                <div class="text-gray-500">Loading test...</div>
            </div>
            
            <div class="mt-6">
                <button onclick="testAdmissionAPI()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Test Admission API
                </button>
                <button onclick="testPaymentsAPI()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 ml-2">
                    Test Payments API
                </button>
            </div>
        </div>
    </div>

    <script>
        // Import API configuration
        const BASE_URL = 'http://localhost:5000/api';
        
        const API_ENDPOINTS = {
            ADMISSIONS: {
                GET: (id) => `/admissions/${id}`,
                LIST_PAYMENTS: (id) => `/admissions/${id}/payments`
            }
        };

        const api = axios.create({
            baseURL: BASE_URL
        });

        // Add request interceptor for auth token
        api.interceptors.request.use(config => {
            const token = localStorage.getItem('token');
            if (token) {
                config.headers.Authorization = `Bearer ${token}`;
            }
            return config;
        });

        async function apiGet(url, params = {}) {
            try {
                const res = await api.get(url, { params });
                return res.data;
            } catch (error) {
                console.error('API Error:', error);
                return { success: false, error: error.message };
            }
        }

        async function testAdmissionAPI() {
            const resultsDiv = document.getElementById('testResults');
            resultsDiv.innerHTML = '<div class="text-blue-600">Testing admission API...</div>';
            
            try {
                // Test with ID 1 (you can change this)
                const response = await apiGet(API_ENDPOINTS.ADMISSIONS.GET(1));
                
                resultsDiv.innerHTML = `
                    <div class="space-y-2">
                        <h3 class="font-semibold text-green-600">✓ Admission API Response:</h3>
                        <pre class="bg-gray-100 p-4 rounded text-sm overflow-x-auto">${JSON.stringify(response, null, 2)}</pre>
                        
                        <h3 class="font-semibold text-blue-600">📊 Response Analysis:</h3>
                        <div class="bg-blue-50 p-4 rounded">
                            <p><strong>Success:</strong> ${response.success !== false ? 'Yes' : 'No'}</p>
                            <p><strong>Has data property:</strong> ${response.data ? 'Yes' : 'No'}</p>
                            <p><strong>Has data.admission:</strong> ${response.data?.admission ? 'Yes' : 'No'}</p>
                            <p><strong>Admission ID:</strong> ${response.data?.admission?._id || 'N/A'}</p>
                            <p><strong>Student Name:</strong> ${response.data?.admission?.name || 'N/A'}</p>
                            <p><strong>Course:</strong> ${response.data?.admission?.course || 'N/A'}</p>
                        </div>
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="text-red-600">
                        <h3 class="font-semibold">✗ Error:</h3>
                        <pre class="bg-red-50 p-4 rounded text-sm">${error.message}</pre>
                    </div>
                `;
            }
        }

        async function testPaymentsAPI() {
            const resultsDiv = document.getElementById('testResults');
            resultsDiv.innerHTML = '<div class="text-green-600">Testing payments API...</div>';
            
            try {
                // Test with ID 1 (you can change this)
                const response = await apiGet(API_ENDPOINTS.ADMISSIONS.LIST_PAYMENTS(1));
                
                resultsDiv.innerHTML = `
                    <div class="space-y-2">
                        <h3 class="font-semibold text-green-600">✓ Payments API Response:</h3>
                        <pre class="bg-gray-100 p-4 rounded text-sm overflow-x-auto">${JSON.stringify(response, null, 2)}</pre>
                        
                        <h3 class="font-semibold text-blue-600">📊 Response Analysis:</h3>
                        <div class="bg-blue-50 p-4 rounded">
                            <p><strong>Success:</strong> ${response.success !== false ? 'Yes' : 'No'}</p>
                            <p><strong>Has data property:</strong> ${response.data ? 'Yes' : 'No'}</p>
                            <p><strong>Has data.payments:</strong> ${response.data?.payments ? 'Yes' : 'No'}</p>
                            <p><strong>Payments count:</strong> ${response.data?.payments ? response.data.payments.length : 0}</p>
                            ${response.data?.payments?.length > 0 ? `
                                <p><strong>First payment amount:</strong> ₹${response.data.payments[0].amount}</p>
                                <p><strong>First payment mode:</strong> ${response.data.payments[0].paymentMode}</p>
                            ` : ''}
                        </div>
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="text-red-600">
                        <h3 class="font-semibold">✗ Error:</h3>
                        <pre class="bg-red-50 p-4 rounded text-sm">${error.message}</pre>
                    </div>
                `;
            }
        }

        // Auto-test on page load
        window.onload = function() {
            console.log('Test page loaded. Click buttons to test APIs.');
        };
    </script>
</body>
</html>

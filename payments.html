<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payments • SSSAM</title>

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Axios -->

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Lucide -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>

    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* Notification banner */
        .notification-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }
        .notification-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
    </style>

</head>

<body class="bg-gray-100">

    <div class="flex h-screen">

        <!-- Mobile Menu Toggle Button (visible only on small screens) -->
        <button id="mobileMenuToggle" class="lg:hidden fixed top-4 left-4 z-50 w-10 h-10 bg-gray-900 text-white rounded-xl flex items-center justify-center shadow-lg">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <!-- Mobile Overlay Backdrop -->
        <div id="mobileOverlay" class="lg:hidden fixed inset-0 bg-black/50 z-40 hidden transition-opacity opacity-0"></div>

        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-56 bg-gradient-to-b from-gray-900 via-purple-950 to-gray-900 text-gray-300 flex flex-col fixed lg:relative inset-y-0 left-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 z-50 shadow-2xl shadow-purple-500/10">
            <div class="px-5 py-4 border-b border-white/10 flex items-center gap-3">
                <div class="w-9 h-9 bg-gradient-to-br from-purple-500 to-purple-700 rounded-lg flex items-center justify-center shadow-lg shadow-purple-500/30">
                    <i data-lucide="graduation-cap" class="text-white w-5 h-5"></i>
                </div>
                <div>
                    <span class="text-base font-bold text-white tracking-tight">SSSAM</span>
                    <p class="text-[10px] text-purple-300/70 uppercase tracking-wider">CRM System</p>
                </div>
            </div>

            <nav class="flex-1 py-3 space-y-0.5 px-2">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition-all duration-200 group">
                    <i data-lucide="layout-dashboard" class="w-[18px] h-[18px] text-gray-400 group-hover:text-white transition-colors"></i>
                    <span class="text-sm font-medium text-gray-300 group-hover:text-white">Dashboard</span>
                </a>
                <a href="enquiries.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition-all duration-200 group">
                    <i data-lucide="message-square" class="w-[18px] h-[18px] text-gray-400 group-hover:text-white transition-colors"></i>
                    <span class="text-sm font-medium text-gray-300 group-hover:text-white">Enquiries</span>
                </a>
                <a href="admissions.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition-all duration-200 group">
                    <i data-lucide="user-check" class="w-[18px] h-[18px] text-gray-400 group-hover:text-white transition-colors"></i>
                    <span class="text-sm font-medium text-gray-300 group-hover:text-white">Admissions</span>
                </a>
                <a href="payments.html" class="bg-gradient-to-r from-purple-600 to-purple-700 text-white flex items-center gap-3 px-4 py-2.5 rounded-lg shadow-lg shadow-purple-500/25">
                    <i data-lucide="wallet" class="w-[18px] h-[18px]"></i>
                    <span class="text-sm font-medium">Payments</span>
                </a>
                <a href="reports.html" id="reportsMenu" class="hidden flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition-all duration-200 group">
                    <i data-lucide="bar-chart-3" class="w-[18px] h-[18px] text-gray-400 group-hover:text-white transition-colors"></i>
                    <span class="text-sm font-medium text-gray-300 group-hover:text-white">Reports</span>
                </a>
            </nav>

            <div class="p-3 border-t border-white/10 bg-black/20">
                <p id="userName" class="text-sm text-white font-medium truncate"></p>
                <p id="userRole" class="text-xs text-purple-300/60"></p>
            </div>

            <button id="mobileCloseBtn" class="lg:hidden absolute top-4 right-4 w-8 h-8 bg-white/10 text-gray-400 hover:text-white hover:bg-white/20 rounded-lg flex items-center justify-center transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </aside>

        <!-- MAIN -->

        <div class="flex-1 flex flex-col">

            <!-- HEADER WITH NOTIFICATION -->
            <header class="notification-banner px-6 py-4 flex justify-between items-center shadow-xl lg:pl-6 pl-16 text-white relative">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm">
                        <i data-lucide="wallet" class="w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-white">Payments</h1>
                        <p class="text-sm text-white/80">Track all payment transactions</p>
                    </div>
                </div>
                <button id="logoutBtn" class="flex items-center gap-2 text-white/90 hover:text-white transition-colors font-medium text-sm bg-white/10 px-4 py-2 rounded-lg backdrop-blur-sm hover:bg-white/20">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span>Logout</span>
                </button>
            </header>

            <!-- CONTENT -->
            <main class="p-6 space-y-6 overflow-y-auto">

                <!-- DATE FILTER -->
                <div class="bg-white p-4 rounded-xl shadow-sm">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex items-center gap-2">
                            <i data-lucide="calendar" class="w-5 h-5 text-gray-600"></i>
                            <span class="font-medium text-gray-800">Date Filter</span>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <button onclick="setFilter('thisMonth')" id="filter-thisMonth" class="px-4 py-2 text-sm rounded-lg bg-blue-600 text-white border border-blue-600 transition-colors">This Month</button>
                            <button onclick="setFilter('thisYear')" id="filter-thisYear" class="px-4 py-2 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors">This Year</button>
                            <button onclick="setFilter('allTime')" id="filter-allTime" class="px-4 py-2 text-sm rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors">All Time</button>
                            <div class="flex items-center gap-2 ml-2">
                                <select id="monthSelector" onchange="setFilter('month')" class="px-3 py-2 text-sm rounded-lg border border-gray-200 focus:outline-none focus:border-blue-500">
                                    <option value="">Select Month</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- STATS -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">

                    <div class="bg-white p-4 rounded-xl shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
                                <i data-lucide="wallet" class="w-5 h-5 text-blue-600"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500">Total Payments</p>
                                <p id="totalPayments" class="text-xl font-bold text-gray-800">0</p>
                            </div>
                        </div>
                        <p id="totalAmount" class="text-sm text-green-600 mt-2 font-medium">₹0</p>
                    </div>

                    <div class="bg-white p-4 rounded-xl shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
                                <i data-lucide="banknote" class="w-5 h-5 text-green-600"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500">Cash</p>
                                <p id="cashCount" class="text-xl font-bold text-gray-800">0</p>
                            </div>
                        </div>
                        <p id="cashAmount" class="text-sm text-green-600 mt-2 font-medium">₹0</p>
                    </div>

                    <div class="bg-white p-4 rounded-xl shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center">
                                <i data-lucide="smartphone" class="w-5 h-5 text-purple-600"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500">UPI</p>
                                <p id="upiCount" class="text-xl font-bold text-gray-800">0</p>
                            </div>
                        </div>
                        <p id="upiAmount" class="text-sm text-green-600 mt-2 font-medium">₹0</p>
                    </div>

                    <div class="bg-white p-4 rounded-xl shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-amber-100 rounded-lg flex items-center justify-center">
                                <i data-lucide="credit-card" class="w-5 h-5 text-amber-600"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500">Card</p>
                                <p id="cardCount" class="text-xl font-bold text-gray-800">0</p>
                            </div>
                        </div>
                        <p id="cardAmount" class="text-sm text-green-600 mt-2 font-medium">₹0</p>
                    </div>

                    <div class="bg-white p-4 rounded-xl shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-red-100 rounded-lg flex items-center justify-center">
                                <i data-lucide="arrow-left" class="w-5 h-5 text-red-600"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500">Refunds</p>
                                <p id="refundCount" class="text-xl font-bold text-gray-800">0</p>
                            </div>
                        </div>
                        <p id="refundAmount" class="text-sm text-red-600 mt-2 font-medium">₹0</p>
                    </div>

                </div>

                <!-- TABLE -->
                <div class="bg-white rounded-xl shadow overflow-hidden">

                    <table class="w-full text-sm">

                        <thead class="bg-gray-50 text-gray-600 font-medium">
                            <tr>
                                <th class="px-6 py-3 text-left cursor-pointer hover:bg-gray-100 transition-colors" onclick="sortTable('student')">
                                    <div class="flex items-center gap-1">
                                        Student
                                        <i data-lucide="chevrons-up-down" class="w-4 h-4 text-gray-400"></i>
                                    </div>
                                </th>
                                <th class="px-6 py-3 cursor-pointer hover:bg-gray-100 transition-colors" onclick="sortTable('course')">
                                    <div class="flex items-center justify-center gap-1">
                                        Course
                                        <i data-lucide="chevrons-up-down" class="w-4 h-4 text-gray-400"></i>
                                    </div>
                                </th>
                                <th class="px-6 py-3 cursor-pointer hover:bg-gray-100 transition-colors" onclick="sortTable('amount')">
                                    <div class="flex items-center justify-center gap-1">
                                        Amount
                                        <i data-lucide="chevrons-up-down" class="w-4 h-4 text-gray-400"></i>
                                    </div>
                                </th>
                                <th class="px-6 py-3 cursor-pointer hover:bg-gray-100 transition-colors" onclick="sortTable('mode')">
                                    <div class="flex items-center justify-center gap-1">
                                        Mode
                                        <i data-lucide="chevrons-up-down" class="w-4 h-4 text-gray-400"></i>
                                    </div>
                                </th>
                                <th class="px-6 py-3 cursor-pointer hover:bg-gray-100 transition-colors" onclick="sortTable('date')">
                                    <div class="flex items-center justify-center gap-1">
                                        Date
                                        <i data-lucide="chevrons-up-down" class="w-4 h-4 text-gray-400"></i>
                                    </div>
                                </th>
                            </tr>
                        </thead>

                        <tbody id="paymentTable">
                            <tr>
                                <td colspan="5" class="text-center py-12">
                                    <div class="flex flex-col items-center gap-3">
                                        <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center">
                                            <i data-lucide="loader-2" class="w-6 h-6 text-gray-400 animate-spin"></i>
                                        </div>
                                        <p class="text-gray-500">Loading payments...</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>

                    </table>

                    <!-- PAGINATION -->
                    <div class="border-t border-gray-100 px-6 py-4 flex items-center justify-between">

                        <div class="text-sm text-gray-500">
                            Showing <span id="showingFrom" class="font-medium text-gray-800">0</span> to <span id="showingTo" class="font-medium text-gray-800">0</span> of <span id="totalItems" class="font-medium text-gray-800">0</span> payments
                        </div>

                        <div class="flex items-center gap-2">
                            <button id="firstPage" onclick="goToPage(1)" class="px-3 py-2 text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                <i data-lucide="chevrons-left" class="w-4 h-4"></i>
                            </button>
                            <button id="prevPage" onclick="changePage(-1)" class="px-3 py-2 text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                <i data-lucide="chevron-left" class="w-4 h-4"></i>
                            </button>

                            <div id="pageNumbers" class="flex items-center gap-1">
                                <span class="px-3 py-2 text-sm bg-blue-600 text-white rounded-lg font-medium">1</span>
                            </div>

                            <button id="nextPage" onclick="changePage(1)" class="px-3 py-2 text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </button>
                            <button id="lastPage" onclick="goToLastPage()" class="px-3 py-2 text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                <i data-lucide="chevrons-right" class="w-4 h-4"></i>
                            </button>
                        </div>

                    </div>

                </div>

            </main>

        </div>

    </div>

    <!-- TOAST -->

    <div id="toast" class="fixed top-4 right-4 hidden"></div>

    <!-- JS -->

    <script src="js/api.js"></script>

    <script src="js/ui.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/payment.js"></script>

    <script src="js/sidebar.js"></script>

    <script>
        lucide.createIcons();

        // Mobile Menu Toggle
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');
        const mobileCloseBtn = document.getElementById('mobileCloseBtn');
        const sidebar = document.getElementById('sidebar');
        const mobileOverlay = document.getElementById('mobileOverlay');

        function openMobileMenu() {
            sidebar.classList.remove('-translate-x-full');
            mobileOverlay.classList.remove('hidden');
            setTimeout(() => mobileOverlay.classList.remove('opacity-0'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeMobileMenu() {
            sidebar.classList.add('-translate-x-full');
            mobileOverlay.classList.add('opacity-0');
            setTimeout(() => mobileOverlay.classList.add('hidden'), 300);
            document.body.style.overflow = '';
        }

        mobileMenuToggle?.addEventListener('click', openMobileMenu);
        mobileCloseBtn?.addEventListener('click', closeMobileMenu);
        mobileOverlay?.addEventListener('click', closeMobileMenu);

        // Close on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeMobileMenu();
        });
    </script>

    <script src="js/notifications.js"></script>

</body>

</html>
